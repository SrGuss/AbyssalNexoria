name: NexoriaLogin
version: 0.1.0
main: com.abyssalnexoria.login.NexoriaLoginPlugin
api-version: '1.21'
author: Abyssal Nexoria
description: Autenticação sincronizada entre Minecraft e o site.
commands:
  login:
    usage: /login <senha>
  register:
    usage: /register <senha> <confirmacao>
permissions:
  nexoria.login.bypass:
    default: op
